; DJ Doorbell — one codebase, two boards. See CLAUDE.md for the spec.
;   pio run -e outside    ESP32-S3 pad unit
;   pio run -e inside     ESP32-WROOM-32D chime unit
;   pio test -e native    host unit tests (engine only, no hardware)

[platformio]
default_envs = outside, inside

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.embed_files =
  data/raw/00_loop.raw
  data/raw/01_kick.raw
  data/raw/02_clap.raw
  data/raw/03_hat.raw
  data/raw/04_stab_am.raw
  data/raw/05_stab_c.raw
  data/raw/06_stab_em.raw
  data/raw/07_sub.raw
  data/raw/08_pluck.raw
  data/raw/09_riser.raw

[env:outside]
extends = base
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = -DUNIT_OUTSIDE -DBOARD_HAS_PSRAM
lib_deps = adafruit/Adafruit NeoPixel

; Pixel chain test for the outside unit: pio run -e outside_pixeltest -t upload
[env:outside_pixeltest]
extends = env:outside
build_flags = ${env:outside.build_flags} -DPIXEL_TEST

[env:inside]
extends = base
board = esp32dev
board_build.partitions = huge_app.csv
build_flags = -DUNIT_INSIDE

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra

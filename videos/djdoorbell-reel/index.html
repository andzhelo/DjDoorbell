    <script>
      const tl = gsap.timeline({ paused: true });

      // ---- rhythm chrome: one tempo grid drives the pad grid + step bar ----
      const BEAT = 0.483809, BAR = 1.935234, TOTAL = 38.705;
      const pads = gsap.utils.toArray("#hud-grid .pad");
      const steps = gsap.utils.toArray("#hud-steps .step");
      const nBeats = Math.floor(TOTAL / BEAT);
      for (let b = 0; b < nBeats; b++) {
        const t = b * BEAT;
        // kick on 1 & 3 lights row 1, clap on 2 & 4 lights row 3, row 2 walks.
        const which = (b % 4 === 0) ? b % 3 : (b % 2 === 1) ? 6 + (b % 3) : 3 + (b % 3);
        tl.fromTo(pads[which], { scale: 1.45, opacity: 1 }, { scale: 1, opacity: 0.35, duration: BEAT * 0.9, ease: "power3.out", immediateRender: false, overwrite: "auto" }, t);
      }
      const nSteps = Math.floor(TOTAL / (BEAT / 4));
      for (let s = 0; s < nSteps; s++) {
        const t = s * (BEAT / 4);
        tl.fromTo(steps[s % 16], { opacity: 1, scaleY: 1.6 }, { opacity: 0.25, scaleY: 1, duration: BEAT / 4 * 0.95, ease: "none", immediateRender: false, overwrite: "auto" }, t);
      }

      tl.fromTo("#ot0", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out", immediateRender: false }, BEAT * 1);
      tl.fromTo("#ot1", { opacity: 0, scale: 1.6, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out", immediateRender: false }, BEAT * 2);
      tl.fromTo("#ot2", { opacity: 0, x: -220 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, BEAT * 3);
      tl.fromTo("#cap01-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 4.112);
      tl.fromTo("#cap01-t", { opacity: 0, y: 60, skewY: 4 }, { opacity: 1, y: 0, skewY: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, 4.112);
      tl.fromTo("#cap02-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 7.983);
      tl.fromTo("#cap02-t", { opacity: 0, y: 60, skewY: 4 }, { opacity: 1, y: 0, skewY: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, 7.983);
      tl.fromTo("#cap03-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 11.853);
      tl.fromTo("#cap03-t", { opacity: 0, y: 60, skewY: 4 }, { opacity: 1, y: 0, skewY: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, 11.853);
      tl.fromTo("#cap04-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 15.724);
      tl.fromTo("#cap04-t", { opacity: 0, y: 60, skewY: 4 }, { opacity: 1, y: 0, skewY: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, 15.724);
      tl.fromTo("#cap05-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 19.594);
      tl.fromTo("#cap05-t", { opacity: 0, y: 60, skewY: 4 }, { opacity: 1, y: 0, skewY: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, 19.594);
      tl.fromTo("#cap07-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 27.335);
      tl.fromTo("#cap07-t", { opacity: 0, y: 60, skewY: 4 }, { opacity: 1, y: 0, skewY: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, 27.335);
      tl.fromTo("#cap08-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 31.206);
      tl.fromTo("#cap08-t", { opacity: 0, y: 60, skewY: 4 }, { opacity: 1, y: 0, skewY: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, 31.206);
      tl.fromTo("#cap09-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power4.out", immediateRender: false }, 35.076);
      tl.fromTo("#cap09-t", { opacity: 0, y: 60, skewY: 4 }, { opacity: 1, y: 0, skewY: 0, duration: 0.4, ease: "power4.out", immediateRender: false }, 35.076);
      tl.fromTo("#end-url", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false }, BAR * 18 + BEAT * 2);
      tl.to("#end-fade", { opacity: 1, duration: 0.8, ease: "power2.in" }, TOTAL - 0.85);
      window.__timelines["main"] = tl;
